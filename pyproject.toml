
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project]
name = "bi-autogen"
version = "0.1.0"
description = "BI data analysis agent built on AutoGen SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "autogen-agentchat>=0.7.5",
    "autogen-ext>=0.7.5",
    "elasticsearch7>=7.10.0,<8.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "openai>=2.46.0",
    "playwright>=1.40.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pydantic-settings>=2.14.2",
    "scikit-learn>=1.6.0",
    "scipy>=1.14.0",
    "sqlparse>=0.5.0",
    "statsmodels>=0.14.0",
    "asyncpg>=0.30.0",
    "tiktoken>=0.13.0",
    "pyecharts>=2.0.0",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["bi_autogen"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "e2e: end-to-end tests that hit real LLM/API endpoints (deselect with '-m \"not e2e\"')",
]

[tool.uv.sources]
bi-autogen = { workspace = true }